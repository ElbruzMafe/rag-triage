[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-triage"
version = "0.1.0"
description = "Tells you whether a wrong RAG answer is a corpus, retrieval, or generation problem"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
rag-triage = "ragtriage.cli:main"

[tool.setuptools]
packages = ["ragtriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
